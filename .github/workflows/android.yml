name: Android

# Bouwt de native app in android/, test hem op een emulator en zet bij een push naar Main de APK bij een
# GitHub-release. De downloadlink blijft gelijk: .../releases/latest/download/kinderwoordjes.apk
on:
  push:
    paths:
      - "android/**"
      - "words.js"
      - "img/**"
      - "icon.svg"
      - "scripts/android-assets.mjs"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "words.js"
      - "img/**"
      - "icon.svg"
      - "scripts/android-assets.mjs"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gegenereerde bestanden zijn bij met words.js en img/
        run: |
          node scripts/android-assets.mjs
          if [ -n "$(git status --porcelain -- android)" ]; then
            git status --short -- android
            echo "::error::android/ loopt achter op words.js/img/icon.svg: draai node scripts/android-assets.mjs en commit"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Sleutel uit de secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > android/release.jks
            echo "RELEASE_STORE_FILE=release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Geen ANDROID_KEYSTORE_BASE64-secret: de APK wordt met een wisselende debugsleutel ondertekend, dus een update installeert niet over de vorige heen."
          fi

      - name: Testen en bouwen
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: APK klaarzetten
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk kinderwoordjes.apk
          ls -l kinderwoordjes.apk
          rm -f android/release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: kinderwoordjes.apk

  rooktest:
    needs: bouwen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: KVM aan
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Op de emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/ci/rooktest.sh kinderwoordjes.apk

      # Op een eigen branch, zodat je ze met git kunt bekijken zonder in te loggen bij Actions.
      - name: Schermafdrukken naar de branch ci-schermafdrukken
        if: always() && github.event_name == 'push'
        run: |
          [ -d shots ] || exit 0
          cd shots
          git init -q -b ci-schermafdrukken
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Rooktest van ${GITHUB_REF_NAME} @ ${GITHUB_SHA}, run ${GITHUB_RUN_NUMBER}" > README.md
          git add -A && git commit -qm "Rooktest run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-schermafdrukken

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/Main'
    needs: [bouwen, rooktest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.${{ github.run_number }}
          name: Woordjes voor Android 1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: kinderwoordjes.apk
          body: |
            Native Android-app van Woordjes. Download **kinderwoordjes.apk** hieronder en open hem op je telefoon
            (sta "installeren uit onbekende bron" toe voor je browser of bestandsbeheer).

            Gebouwd uit ${{ github.sha }}.

<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kinderwoordjes</title>
<meta name="description" content="Eerste woordjes leren voor peuters: kies een categorie, zie het plaatje en het woord, tik voor het volgende. Gratis, zonder reclame, werkt offline.">
<meta name="theme-color" content="#fff4e0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --bg:#fff4e0; --text:#3b2f2f; --card:#fff; --shadow:0 6px 0 rgba(0,0,0,.12); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overscroll-behavior:none; }
  body { background:var(--bg); color:var(--text); overflow:hidden; user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none; touch-action:manipulation;
    font-family:"Comic Sans MS","Chalkboard SE","Baloo 2",ui-rounded,system-ui,sans-serif; }
  .screen { position:fixed; inset:0; display:none; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .screen.on { display:flex; }

  #home { flex-direction:column; }
  #home header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 4px; }
  #home h1 { margin:0; font-size:clamp(24px,6vw,40px); }
  #home header div { display:flex; gap:10px; }
  #installeer[hidden] { display:none; }
  #geluid, #installeer { font-size:28px; width:56px; height:56px; border:0; border-radius:50%; background:var(--card); box-shadow:var(--shadow); }
  #cats { flex:1; overflow-y:auto; display:grid; gap:16px; padding:12px 16px 24px;
    grid-template-columns:repeat(auto-fill,minmax(min(42vw,190px),1fr)); align-content:start; }
  .cat { border:0; border-radius:28px; padding:14px 8px 12px; box-shadow:var(--shadow); color:var(--text);
    display:flex; flex-direction:column; align-items:center; gap:8px; font:inherit; font-size:clamp(20px,5vw,28px); font-weight:bold; }
  .cat img { width:70%; max-width:130px; aspect-ratio:1; }
  .cat:active { transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.12); }

  #kaart { flex-direction:column; align-items:center; justify-content:center; cursor:pointer; touch-action:none; }
  #plaatje, #woord { transition:scale .08s ease-out; }
  #kaart.druk #plaatje, #kaart.druk #woord { scale:.93; }
  #plaatje { width:min(70vw,55vh); aspect-ratio:1; filter:drop-shadow(0 8px 0 rgba(0,0,0,.12)); }
  #woord { margin-top:4vh; font-size:clamp(44px,13vw,110px); font-weight:bold; letter-spacing:.02em; text-align:center; padding:0 16px; }
  .pop { animation:pop .35s cubic-bezier(.3,1.6,.6,1); }
  @keyframes pop { from { transform:scale(.8); opacity:.5; } to { transform:scale(1); opacity:1; } }
  .zeg { animation:zeg .45s ease-in-out; }
  @keyframes zeg { 30% { transform:scale(1.12) rotate(-4deg); } 65% { transform:scale(1.06) rotate(3deg); } }
  #terug { position:absolute; top:calc(env(safe-area-inset-top) + 14px); left:calc(env(safe-area-inset-left) + 14px);
    width:72px; height:72px; border:0; border-radius:50%; background:var(--card); box-shadow:var(--shadow); padding:14px; }
  #terug img { width:100%; height:100%; }
  @media (prefers-reduced-motion: reduce) { .pop, .zeg { animation:flits .3s; } }
  @keyframes flits { 50% { opacity:.55; } }
</style>
</head>
<body>
<section id="home" class="screen on">
  <header><h1>Woordjes</h1><div><button id="installeer" aria-label="Installeren als app" hidden>📲</button><button id="geluid" aria-label="Voorlezen" aria-pressed="true">🔊</button></div></header>
  <div id="cats"></div>
</section>
<section id="kaart" class="screen" aria-live="polite">
  <button id="terug" aria-label="Terug naar de categorieën"><img src="img/1f3e0.svg" alt=""></button>
  <img id="plaatje" alt="">
  <div id="woord"></div>
</section>
<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>

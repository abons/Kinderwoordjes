// Dezelfde toolchain als de zusterapps (wordpuzzle, wordguesser): deze drie gaan alleen samen omhoog.
// compileSdk 35 heeft AGP 8.6+ nodig, AGP 8.7 Gradle 8.9+, en Kotlin 2.0.21 is getest tegen AGP 8.7.
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
}
